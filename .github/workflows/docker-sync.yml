name: Docker Image Sync

on:
  push:
    branches: [ main ]

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Login to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}
      
      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_TOKEN }}
      
      - name: Read images list
        id: images
        run: |
          echo "images<<EOF" >> $GITHUB_OUTPUT
          cat images.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Pull and save images
        run: |
          while IFS= read -r image; do
            # Skip empty lines and comments
            if [[ -z "$image" || "$image" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            
            echo "Processing image: $image"
            
            # Create safe filename by replacing / and : with _
            safe_filename=$(echo "$image" | sed 's/[\/:]/_/g').tar
            echo "Saving to: $safe_filename"
            
            # Pull the image
            docker pull "$image"
            
            # Save image to tar file
            docker save "$image" -o "$safe_filename"
            
            # Verify the file was created
            if [[ -f "$safe_filename" ]]; then
              echo "Successfully saved $image to $safe_filename"
            else
              echo "Error: Failed to save $image"
              exit 1
            fi
          done < images.txt
      
      - name: Upload tar files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: '*.tar'